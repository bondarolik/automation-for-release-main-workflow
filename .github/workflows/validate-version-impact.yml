name: Validate version impact

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-version-impact:
    name: Validate version impact
    runs-on: ubuntu-latest

    # This repository expects production PRs to be release -> main.
    if: >
      github.event.pull_request.head.ref == 'release' &&
      github.event.pull_request.base.ref == 'main'

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate Version Impact
        id: version_impact
        run: node .github/scripts/read-version-impact.mjs

      - name: Write workflow summary
        env:
          VERSION_IMPACT: ${{ steps.version_impact.outputs.impact }}
          SHOULD_RELEASE: ${{ steps.version_impact.outputs.should_release }}
        run: |
          {
            echo "## Version Impact validation"
            echo
            echo "- Pull request: #${{ github.event.pull_request.number }}"
            echo "- Source: \`${{ github.event.pull_request.head.ref }}\`"
            echo "- Target: \`${{ github.event.pull_request.base.ref }}\`"
            echo "- Selected impact: \`${VERSION_IMPACT}\`"
            echo "- Create release artifacts: \`${SHOULD_RELEASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
